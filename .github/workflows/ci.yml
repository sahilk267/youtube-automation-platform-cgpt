name: ViralOS offline regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app tests tools
      - name: Run offline regression
        run: python -m pytest -q
      - name: Verify JavaScript syntax
        run: |
          if command -v node >/dev/null; then node --check app/static/app.js; fi
      - name: Verify package contains no embedded secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,sys
          forbidden=(r'gh[pousr]_[A-Za-z0-9]{30,}',r'sk-[A-Za-z0-9]{30,}',r'AIza[0-9A-Za-z_-]{35}',r'-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY')
          matches=[]
          for base in ('app','docs','sql','tests','tools'):
              for p in Path(base).rglob('*'):
                  if not p.is_file() or p.suffix not in ('.py','.md','.json','.sql','.txt','.js','.yaml','.yml'):continue
                  s=p.read_text('utf8',errors='ignore')
                  if any(re.search(pattern,s) for pattern in forbidden):matches.append(str(p))
          if matches:print('Possible credentials in files:',matches);sys.exit(1)
          print('No known high-confidence credential signatures detected (not a complete secret audit)')
          PY
  windows-safety-smoke:
    name: Windows offline backup and recovery tests (GitHub runner, not owner PC)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Windows recovery, M2.5 evaluator and local Piper-runner tools
        run: python -m compileall -q tools/owner_acceptance.py tools/audio_acceptance.py tools/create_voice_manifest.py tools/run_local_piper.py tools/run_local_alignment.py tests/test_owner_acceptance.py tests/test_audio_acceptance.py tests/test_voice_manifest_template.py tests/test_run_local_piper.py tests/test_run_local_alignment.py
      - name: Run Windows recovery, voice and local alignment synthetic negative tests
        run: python -m pytest -q tests/test_owner_acceptance.py tests/test_audio_acceptance.py tests/test_voice_manifest_template.py tests/test_run_local_piper.py tests/test_run_local_alignment.py -k "not benchmark"